name: Server image

# Builds the Nostube Server image (apps/server/Dockerfile: web assets and binary are built inside
# the image). Every run builds it and smoke-tests the container; only main and server-v* tags
# push it to ghcr.io.

on:
  push:
    branches: ['main']
    tags: ['server-v*']
    paths:
      - 'apps/server/**'
      - 'apps/site/**'
      - 'apps/studio/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'scripts/build-server-web.sh'
      - 'package-lock.json'
      - '.github/workflows/server-image.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'apps/server/**'
      - 'apps/site/**'
      - 'apps/studio/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'scripts/build-server-web.sh'
      - 'package-lock.json'
      - '.github/workflows/server-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The deploy steps run only on main, and only where a deployment is set up (secrets).
      HAS_DEPLOY: ${{ secrets.COOLIFY_SERVER_UUID != '' && secrets.COOLIFY_TAILNET_HOST != '' && secrets.TS_AUTHKEY != '' }}
      HAS_SERVER_URL: ${{ secrets.NOSTUBE_SERVER_URL != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nostube-server" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=match,pattern=server-v(.*),group=1

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          build-args: REVISION=${{ github.sha }}
          load: true
          tags: nostube-server:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name smoke -p 8080:8080 \
            -e NOSTUBE_ORIGIN=https://ci.example.org nostube-server:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/health
          # The image reports the commit it was built from (the deploy check below relies on it).
          curl -fsS http://127.0.0.1:8080/api/health | grep -q "\"revision\":\"${GITHUB_SHA}\""
          # The site, the studio, the embed player and the public config are all served.
          for path in / /studio/ /embed.html /api/config; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$path")
            echo "$path -> $code"
            test "$code" = "200"
          done
          curl -fsS http://127.0.0.1:8080/api/config | grep -q '"origin":"https://ci.example.org"'
          # The studio's API wants a login, and the setup link names the public origin.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/admin/config)" = "401"
          docker logs smoke 2>&1 | grep -q 'https://ci.example.org/admin/setup#token='
          # docker stop must end the server by itself (SIGTERM), not by the SIGKILL after 10 s.
          start=$(date +%s)
          docker stop smoke >/dev/null
          elapsed=$(( $(date +%s) - start ))
          echo "stopped in ${elapsed}s"
          test "$elapsed" -lt 9
          test "$(docker inspect smoke --format '{{.State.ExitCode}}')" = "0"

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          build-args: REVISION=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      # A deployment of this image (a Coolify application that pulls ghcr.io/<owner>/nostube-server:main).
      # Every address and id comes from secrets, none of them is written down in this public repository.
      - name: Join the private network
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_DEPLOY == 'true'
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Deploy the new image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_DEPLOY == 'true'
        env:
          COOLIFY_TAILNET_HOST: ${{ secrets.COOLIFY_TAILNET_HOST }}
          COOLIFY_SERVER_UUID: ${{ secrets.COOLIFY_SERVER_UUID }}
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
        run: |
          curl --fail --show-error --connect-timeout 10 "http://${COOLIFY_TAILNET_HOST}:8000/api/health"
          curl --fail --show-error --request POST \
            "http://${COOLIFY_TAILNET_HOST}:8000/api/v1/deploy?uuid=${COOLIFY_SERVER_UUID}" \
            --header "Authorization: Bearer ${COOLIFY_DEPLOY_TOKEN}"

      # A green deploy proves nothing (the old image can keep running): wait until the running
      # instance reports exactly the commit that was just built.
      - name: Wait for the new revision
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_DEPLOY == 'true' && env.HAS_SERVER_URL == 'true'
        env:
          SERVER_URL: ${{ secrets.NOSTUBE_SERVER_URL }}
        run: |
          for i in $(seq 1 60); do
            revision=$(curl -fsS --max-time 10 "${SERVER_URL}/api/health" 2>/dev/null | sed -n 's/.*"revision":"\([^"]*\)".*/\1/p')
            if [ "$revision" = "$GITHUB_SHA" ]; then
              echo "the instance runs $revision"
              exit 0
            fi
            sleep 10
          done
          echo "the instance still reports '${revision:-nothing}', expected $GITHUB_SHA" >&2
          exit 1
