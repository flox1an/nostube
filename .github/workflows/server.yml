name: Server

on:
  push:
    branches: ['main']
    paths:
      - 'apps/server/**'
      - 'apps/site/**'
      - 'apps/web/embed.html'
      - 'apps/web/vite.embed.config.ts'
      - 'apps/web/src/**'
      - 'packages/**'
      - 'scripts/build-server-web.sh'
      - 'package-lock.json'
      - '.github/workflows/server.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'apps/server/**'
      - 'apps/site/**'
      - 'apps/web/embed.html'
      - 'apps/web/vite.embed.config.ts'
      - 'apps/web/src/**'
      - 'packages/**'
      - 'scripts/build-server-web.sh'
      - 'package-lock.json'
      - '.github/workflows/server.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      # The server embeds apps/server/web/dist at compile time (RustEmbed), so the
      # site and embed build has to exist before cargo runs.
      - name: Build embedded web assets (site + embed player)
        run: scripts/build-server-web.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/server

      - name: cargo check
        working-directory: apps/server
        run: cargo check --locked --all-targets

      - name: cargo test
        working-directory: apps/server
        run: cargo test --locked
