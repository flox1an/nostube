name: Test

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      # Unused files, exports and dependencies, and imports a package.json does not declare.
      - name: Check for dead code and undeclared dependencies
        run: npm run knip

      - name: Check core, widgets, site and studio (lint, typecheck, test)
        run: |
          npm run lint --workspace @nostube/core --workspace @nostube/widgets --workspace @nostube/site --workspace @nostube/studio
          npm run typecheck --workspace @nostube/core --workspace @nostube/widgets --workspace @nostube/site --workspace @nostube/studio
          npm run test --workspace @nostube/core --workspace @nostube/widgets --workspace @nostube/site --workspace @nostube/studio

      - name: Build site and studio
        run: |
          npm run build --workspace @nostube/site
          npm run build --workspace @nostube/studio

      - name: Run tests
        working-directory: apps/web
        run: npm run test

  # The desktop shell is otherwise only compiled by the release workflow.
  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web/src-tauri

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/web/src-tauri

      # tauri-build wants the frontend dist and the sidecar binary to exist; clippy needs neither's content.
      - name: Stub frontend and sidecar
        run: |
          mkdir -p ../dist binaries
          touch binaries/almond-x86_64-unknown-linux-gnu

      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
