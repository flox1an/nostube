name: Test

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Check core, widgets and site (lint, typecheck, test)
        run: |
          npm run lint --workspace @nostube/core --workspace @nostube/widgets --workspace @nostube/site
          npm run typecheck --workspace @nostube/core --workspace @nostube/widgets --workspace @nostube/site
          npm run test --workspace @nostube/core --workspace @nostube/widgets --workspace @nostube/site

      - name: Build site
        run: npm run build --workspace @nostube/site

      - name: Run tests
        working-directory: apps/web
        run: npm run test
