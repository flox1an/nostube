# Coolify-deployable web stack (UI + oEmbed/playlist APIs).
# Relay, Almond, imgproxy and the DVM already run in infra/test-stack.
services:
  web:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8080
    expose:
      - '8080'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/health']
      interval: 30s
      timeout: 5s
      retries: 3
