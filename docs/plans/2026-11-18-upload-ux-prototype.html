/* Felder */
label.f{display:block;font-size:13px;font-weight:600;margin-bottom:6px}

.scene{--h:200;position:relative;overflow:hidden;aspect-ratio:16/9;border-radius:10px;background:
 radial-gradient(circle at var(--sx,70%) var(--sy,38%),oklch(.95 .09 85) 0 5%,transparent 6%),
 linear-gradient(to bottom,oklch(.78 .09 var(--h)) 0%,oklch(.86 .06 calc(var(--h) + 40)) 46%,oklch(.42 .07 calc(var(--h) - 10)) 47%,oklch(.3 .06 calc(var(--h) - 20)) 100%)}

.frames{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

.frame.own{display:grid;place-items:center;border:1.5px dashed var(--input);aspect-ratio:16/9;color:var(--muted-foreground);font-size:12px;gap:2px}

.secs{border-top:1px solid var(--border)}
.sec{border-bottom:1px solid var(--border)}

.pro{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--primary);border:1px solid color-mix(in oklch,var(--primary) 45%,transparent);padding:0 5px;border-radius:4px}
pre.ev{margin:0;font:11.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--muted);border-radius:10px;padding:12px;overflow:auto;max-height:220px}

.rail{position:sticky;top:64px;display:flex;flex-direction:column;gap:16px}
.card{border:1px solid var(--border);border-radius:14px;background:var(--card)}
.preview{padding:12px}
.preview .meta{display:flex;gap:10px;margin-top:10px}

.preview .tt{font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cap{font-size:11.5px;font-weight:600;color:var(--muted-foreground);padding:12px 14px 0}
.steps{list-style:none;margin:0;padding:6px 14px 12px}
.step{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:8px 0}
.step .dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--input);color:var(--muted-foreground)}
.step.done .dot{background:var(--ok);border-color:var(--ok);color:var(--background)}
.step.active .dot{border-color:var(--primary);color:var(--primary)}
.step.wait .dot{border-style:dashed;border-color:var(--warn);color:var(--warn)}
.step .dot svg{width:12px;height:12px;stroke-width:3}
.step .t{font-weight:600;font-size:13.5px;display:flex;justify-content:space-between;gap:8px}
.step .d{font-size:12px;color:var(--muted-foreground)}
.bar{height:6px;border-radius:999px;background:var(--muted);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:var(--primary);border-radius:inherit;transition:width .25s linear}
.pub{padding:16px;display:grid;gap:10px}
.pub .state{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.armed{background:color-mix(in oklch,var(--primary) 10%,var(--card));border-color:color-mix(in oklch,var(--primary) 45%,var(--border))}

input[type=checkbox]{accent-color:var(--primary);width:15px;height:15px}

.opt[aria-pressed=true]{border-color:var(--primary);background:color-mix(in oklch,var(--primary) 8%,var(--card))}

.nudge{animation:nudge .4s ease-out}@keyframes nudge{30%{transform:translateX(-6px)}60%{transform:translateX(6px)}}
.two{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:16px}

 .studio{grid-template-columns:1fr}

}

<script>

function encCard(){
 const r=S.res;const dis=S.skip?'disabled':'';const b=(k,l)=>`<button class="tog" aria-pressed="${r[k]&&!S.skip}" data-res="${k}" ${dis}>${l}</button>`;
 const open=S.settings||S.pro;
 return `<div class="enc"><div class="head">${ic('sliders')}<div style="flex:1;min-width:0"><div style="font-weight:600">${S.skip?'Original wird unverändert hochgeladen':'Optimiert für flüssiges Abspielen'}</div><div class="xs mut num">${S.skip?'1,8 GB · H.265, spielt nicht in jedem Browser':`${encLabel()} · ca. ${fmtMB(estMB())} statt 1,8 GB · noch ca. 9 Min.`}</div></div><button class="btn ghost sm" id="encT" aria-expanded="${open}">${open?'Schließen':'Anpassen'}</button></div>
 ${open?`<div class="body">
  <div class="row"><span class="lbl">Verarbeitung</span><button class="tog" aria-pressed="${!S.skip}" data-skip="0">Optimieren (empfohlen)</button><button class="tog" aria-pressed="${!!S.skip}" data-skip="1">Original unverändert hochladen</button></div>

  <div class="row"><span class="lbl">Auflösungen</span>${b(2160,'4K')}${b(1080,'1080p')}${b(720,'720p')}${b(480,'480p')}${S.fmt==='hls'?`<button class="tog" aria-pressed="true" ${dis}>Original als Stufe</button>`:''}</div>

  <div class="row"><span class="lbl">Qualität</span><button class="tog" aria-pressed="${S.quality==='standard'}" data-q="standard" ${dis}>Standard</button><button class="tog" aria-pressed="${S.quality==='hoch'}" data-q="hoch" ${dis}>Hoch</button></div>

 </div>`:''}</div>`}

function sceneStyle(t){const f=t/372;return `--h:${Math.round(30+200*f)};--sx:${Math.round(12+76*f)}%;--sy:${Math.round(46-26*Math.sin(f*Math.PI))}%`}
const tc=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
function thumbBlock(){const tab=S.thumbTab;const T=(k,l)=>`<button role="tab" aria-selected="${tab===k}" data-ttab="${k}">${l}</button>`;
 let body='';
 if(tab==='auto')body=`<div class="frames" style="grid-template-columns:repeat(3,1fr)">${['dusk','noon','dawn'].map((c,i)=>`<button class="frame" aria-pressed="${S.frame===i}" data-frame="${i}" aria-label="Vorschlag ${i+1}"><div class="scene ${c}"></div></button>`).join('')}</div>
  <div class="hint">Drei Frames automatisch gewählt: scharf, nicht schwarz, verteilt über das Video. Passt keiner? Wähle einen Frame selbst.</div>`;
 if(tab==='frame')body=`<div class="scrub"><div class="scene" id="scrubScene" style="${sceneStyle(S.t)}"><span class="dur num" id="scrubTc">${tc(S.t)} / 6:12</span></div>
  <div class="scrubrow"><button class="iconbtn" data-step="-1" aria-label="Einen Frame zurück">${ic('left')}</button><input type="range" id="scrub" min="0" max="372" step="0.04" value="${S.t}" aria-label="Position im Video"><button class="iconbtn" data-step="1" aria-label="Einen Frame vor">${ic('right')}</button></div>

 if(tab==='url')body=`<div style="display:flex;gap:8px"><input class="field" placeholder="https://… (Bild-URL)" aria-label="Bild-URL"><button class="btn outline">Importieren</button></div><div class="hint">Das Bild wird geladen und auf deinem Speicher abgelegt, nicht nur verlinkt.</div>`;
 return `<div><label class="f">Vorschaubild</label><div class="tabs" role="tablist">${T('auto','Vorschläge')}${T('frame','Frame wählen')}${T('upload','Bild hochladen')}${T('url','Von URL')}</div>${body}
  ${hasStorage()&&S.p.u>0?`<div class="hint">${ic('check')}Vorschaubild auf ${S.account==='list'?'deinen Servern':'Primal'} gespeichert</div>`:''}</div>`}

function sec(id,title,sum,inner,pro=false){if(pro&&!S.pro)return'';const o=S.pro||S.open[id];

 const L=S.skip?[['Original','H.265','3840×2160',1800]]:resList().map(h=>[h===2160?'4K':h+'p',S.hevc?'H.265':'H.264',{2160:'3840×2160',1080:'1920×1080',720:'1280×720',480:'854×480'}[h],{2160:900,1080:420,720:210,480:110}[h]]);
 const up=S.p.u>=100?'1/1':S.p.u>0?'…':'0/1',mi=S.p.m>=100?'2/2':S.p.m>0?'…':'0/2';
 return `<div style="overflow:auto"><table class="var num"><tr><th>Qualität</th><th>Codec</th><th>Abmessungen</th><th>Größe</th><th>Hochgeladen</th><th>Kopien</th><th></th></tr>${L.map(([q,c,d,mb])=>`<tr><td>${q}</td><td>${c}</td><td>${d}</td><td>${fmtMB(mb)}</td><td>${up}</td><td>${mi}</td><td style="white-space:nowrap"><button class="link xs">Vorschau</button> · <button class="link xs" style="color:var(--destructive)">Entfernen</button></td></tr>`).join('')}</table></div>`}
function sections(){const dmode=S.schedule;return `<div class="secs">
 ${sec('files','Video-Dateien',S.p.e>=100?`${S.skip?1:resList().length} ${S.skip||resList().length===1?'Variante':'Varianten'}`:'wird optimiert',`${variantRows()}
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn outline sm">${ic('plus')}Weitere Qualität hinzufügen (eigene Datei)</button><button class="btn outline sm">${ic('wand')}Weitere Versionen erstellen lassen</button></div>
  <div class="hint">${ic('info')}„Erstellen lassen“ nutzt einen Transcoding-Dienst im Nostr-Netz (DVM), falls dein Browser es nicht selbst kann.</div>`)}
 ${sec('sub','Untertitel',S.subs?'1 Datei':'Keine',`<button class="frame own" style="aspect-ratio:auto;padding:18px;width:100%" id="addSub">${ic('plus')}<span>Untertitel hierher ziehen oder auswählen (.vtt, .srt)</span></button>
  ${S.subs?`<div style="display:flex;gap:8px;align-items:center"><span class="sm" style="flex:1">urlaub-gardasee.de.vtt</span><select class="field" style="width:auto;padding:5px 8px"><option>Deutsch</option><option>Englisch</option></select><button class="link xs" style="color:var(--destructive)">Entfernen</button></div><div class="hint">${ic('wand')}Sprache aus dem Dateinamen erkannt</div>`:''}`)}
 ${sec('sched','Veröffentlichung & Sichtbarkeit',(dmode?'Fr, 21.11., 20:00':'Datum: jetzt')+(S.cw?' · Inhaltswarnung':'')+(S.exp&&S.exp!=='none'?' · läuft ab':''),`
  <div><div class="sm" style="font-weight:600;margin-bottom:6px">Veröffentlichungsdatum</div><div class="seg"><button aria-pressed="${!dmode}" data-date="now">Jetzt</button><button aria-pressed="${!!dmode}" data-date="custom">Eigenes Datum</button></div>
  ${dmode?`<div style="display:flex;gap:8px;margin-top:8px"><input class="field" type="date" value="2026-11-21" style="width:auto"><input class="field" type="time" value="20:00" style="width:auto"></div><div class="hint">Auch ein Datum in der Vergangenheit geht, etwa für ältere Aufnahmen.</div>`:''}</div>
  <div><label style="display:flex;gap:8px;align-items:center;font-weight:600" class="sm"><input type="checkbox" id="cw" ${S.cw?'checked':''}> Inhaltswarnung</label>${S.cw?`<input class="field" style="margin-top:8px" placeholder="Grund, z. B. flackerndes Licht">`:''}</div>
  <div><label class="sm" style="font-weight:600;display:block;margin-bottom:6px" for="exp">Läuft ab</label><select class="field" id="exp" style="width:auto">${[['none','Nie'],['1day','Nach 1 Tag'],['7days','Nach 7 Tagen'],['1month','Nach 1 Monat'],['1year','Nach 1 Jahr']].map(([v,l])=>`<option value="${v}" ${S.exp===v?'selected':''}>${l}</option>`).join('')}</select></div>`)}
 ${sec('ppl','Personen & Referenzen','Niemand markiert',`<div><label class="f">Personen im Video</label><input class="field" placeholder="Person suchen (Name oder npub)"></div>
  <div><label class="f">Externe Referenzen</label><div style="display:flex;gap:8px"><input class="field" placeholder="URL oder Nostr-URI"><button class="btn outline">Hinzufügen</button></div><div class="hint">Link zu YouTube, TikTok oder anderen Nostr-Events.</div></div>`)}
 ${sec('relays','Relays','3 von 4','<div class="relaysel">'+['relay.damus.io','nos.lol','relay.primal.net','wss://mein.relay.example'].map((r,i)=>`<label><input type="checkbox" ${i<3?'checked':''}>${r}</label>`).join('')+'</div>',true)}
 ${sec('ev','Event-Vorschau','kind 34235',`<pre class="ev">{"kind":34235,"tags":[
 ["d","gardasee-2026"],["title","${esc(S.title)}"],
 ["imeta","dim 1920x1080","url https://…/9f2c.mp4",
  "x 9f2c…","m video/mp4","fallback https://nostr.download/9f2c.mp4"],
 ["t","reisen"],["t","italien"]]}</pre>`,true)}
</div>`}

function previewCard(){const c=S.frame>=0&&S.frame<3?['dusk','noon','dawn'][S.frame]:'';const st=S.frame===3?` style="${sceneStyle(S.t)}"`:'';return `<div class="card preview"><div class="cap" style="padding:0 0 8px">So erscheint es auf nostube</div><div class="scene ${c||'dusk'}"${st}><span class="dur num">6:12</span></div><div class="meta"><div class="av"></div><div style="min-width:0"><div class="tt">${esc(S.title)||'Ohne Titel'}</div><div class="xs mut">Dein Kanal · ${S.schedule?'Fr, 21.11., 20:00':'gerade eben'}</div></div></div></div>`}

function stepState(k){const p=S.p;
 if(k==='a')return p.a>=100?'done':'active';
 if(k==='e')return S.skip?(p.a>=100?'done':''):p.e>=100?'done':p.a>=100?'active':'';
 if(k==='u')return p.u>=100?'done':S.go&&p.e>=100?'active':S.go?'wait':'';
 if(k==='m')return p.m>=100?'done':p.u>=100?'active':'';}
const nFiles=()=>(S.skip?1:resList().length)+1, nServers=()=>S.account==='list'?3:2;
function step(k,title,desc){const st=stepState(k);const icon=st==='done'?ic('check'):st==='active'?ic('loader','spin'):st==='wait'?ic('clock'):'';
 return `<li class="step ${st}"><span class="dot">${icon}</span><div><div class="t"><span>${title}</span><span class="num xs mut" data-pct="${k}"></span></div><div class="d">${desc}</div>${st==='active'?`<div class="bar"><i data-bar="${k}"></i></div>`:''}</div></li>`}
function pipeline(){const busy=S.p.m<100&&!S.published;
 return `<div class="card"><div class="cap">Verarbeitung</div><ol class="steps">
 ${step('a','Analysieren','4K · H.265 · 6:12')}
 ${step('e',S.skip?'Optimieren übersprungen':'Optimieren im Browser',S.skip?'Original wird hochgeladen':encLabel()+' · läuft auf deinem Gerät')}
  ${step('u','Hochladen',!hasStorage()?'Speicherort fehlt noch':S.go?(S.p.e<100?`startet, sobald die Optimierung fertig ist · auf ${serversLabel()}`:`auf ${serversLabel()} · dein Signer gibt jede Datei pro Server frei`):`auf ${serversLabel()} · erst nach deinem Klick`)}
 ${step('m','Kopien anlegen','damit das Video erreichbar bleibt')}
 </ol>${busy?`<div style="display:flex;gap:4px;padding:0 8px 10px"><button class="btn ghost sm">Abbrechen</button><button class="btn ghost sm" data-sec-open="files">Dateien ansehen</button></div>`:''}</div>`}

function publishCard(){
 const done=S.p.m>=100;
 if(S.published)return `<div class="card pub okc pubdock"><div class="state">${ic('check')}<div><b>„${esc(S.title)}“ ist online.</b><div class="xs mut">Auf ${nServers()} Servern gespeichert, an 3 Relays gesendet.</div></div></div><div style="display:flex;gap:8px"><button class="btn primary sm">${ic('out')}Video ansehen</button><button class="btn outline sm">Teilen</button><button class="btn ghost sm" id="again">Noch ein Video</button></div></div>`;
 if(S.signing==='event')return `<div class="card pub armed pubdock"><div class="state">${ic('pen')}<div><b>Bitte in deinem Signer bestätigen</b><div class="xs mut">Eine Unterschrift für die Veröffentlichung.</div></div></div></div>`;
 if(done)return `<div class="card pub okc pubdock"><div class="state">${ic('check')}<div><b>Hochgeladen und gesichert.</b><div class="xs mut">Schau es dir an, so wie es abgespielt wird, und veröffentliche dann.</div></div></div><button class="btn outline block" id="prev">${ic('film')}Vorschau ansehen</button><button class="btn primary block" id="pubNow">Veröffentlichen</button><button class="btn ghost block" id="save">Als Entwurf speichern</button></div>`;
 if(S.go)return `<div class="card pub armed pubdock"><div class="state">${ic('loader','spin')}<div><b>${S.p.e<100?'Hochladen startet nach der Optimierung.':'Wird hochgeladen …'}</b><div class="xs mut">Du kannst weiter Details bearbeiten. Der Tab muss offen bleiben. Dein Signer fragt für jede Datei und jeden Server nach einer Freigabe.</div></div></div><button class="btn primary block" disabled>Veröffentlichen</button><div class="xs mut">Veröffentlichen geht, sobald alles hochgeladen ist.</div></div>`;
 return `<div class="card pub pubdock">${S.storageHint?`<div class="sig" style="margin:0 0 4px;background:color-mix(in oklch,var(--destructive) 14%,transparent)">${ic('info')}<span>Wähle zuerst oben, wo dein Video gespeichert wird.</span></div>`:''}<button class="btn primary block" id="go">${ic('upload')}Hochladen</button><button class="btn ghost block" id="save">Als Entwurf speichern</button><div class="xs mut" style="display:flex;justify-content:space-between;gap:8px"><span>Bis du klickst, wird nichts hochgeladen. Veröffentlicht wird erst ganz am Ende.</span><button class="link xs" style="color:var(--destructive);white-space:nowrap" id="delDraft">Entwurf löschen …</button></div></div>`}

function previewModal(){return `<div class="overlay ${SEEN.has('pv')?'':(SEEN.add('pv'),'fadein')}" data-modal-bg><div class="modal" role="dialog" aria-modal="true" aria-labelledby="pvh"><header><h3 id="pvh">Vorschau</h3><button class="iconbtn" data-pv="close" aria-label="Schließen">${ic('x')}</button></header>
 <div class="scene" style="${S.frame===3?sceneStyle(S.t):''}" ><span class="dur num">0:00 / 6:12</span></div>
 <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">${resList().map((h,i)=>`<button class="tog" aria-pressed="${i===0}">${h===2160?'4K':h+'p'}</button>`).join('')}<span class="xs mut" style="margin-left:auto;align-self:center">wird von ${S.account==='list'?'deinem Server':S.storage==='own'?'blossom.band':'blossom.primal.net'} abgespielt</span></div>
 <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px"><button class="btn ghost" data-pv="close">Weiter bearbeiten</button><button class="btn primary" id="pubNow">Veröffentlichen</button></div></div></div>`}

/* ───────── Konzept B ───────── */
const HOME=[['Sonnenaufgang am Watzmann','dawn','14:22','Bergwelt'],['Espresso wie in Neapel','dusk','8:03','Kaffeekultur'],['Nostr in 5 Minuten erklärt','noon','5:10','dezentral.tv'],['Segeln vor Rügen','noon','21:47','Ostseeblick'],['Lofi Beats zum Coden','dawn','1:02:00','beatkeller'],['Abendrunde im Park','dusk','6:31','Laufclub'],['Blossom-Server selbst hosten','noon','18:09','selfhost.de'],['Herbst in Kyoto','dusk','11:55','Wanderlust']];
function viewB(){const d=S.dock;const items=d.items;const total=Math.round(items.reduce((s,i)=>s+i.p,0)/items.length);
 const pill=d.shown&&d.min?`<button class="uppill num" id="dockOpen">${ic('loader','spin')} ${items.filter(i=>i.status!=='live').length} Uploads · <span data-dtotal>${total}</span> %</button>`:'';
 return topbar(`${pill}<button class="btn primary sm" id="fakeDrop">${ic('upload')}Hochladen</button>`)+`<main class="home">
  ${note('Ausgefallene Variante: Man zieht Videos auf <b>jede</b> nostube-Seite (oder klickt „Hochladen“). Statt auf eine Upload-Seite zu wechseln, öffnet sich ein Dock unten rechts, und man stöbert weiter. Pro Datei gibt es einen Entwurf mit dem Nötigsten. „Alle Details“ führt zur Studio-Seite aus Konzept A. Klick auf „Hochladen“ simuliert das Reinziehen von drei Dateien.')}
  <h2 style="font-size:18px;margin:22px 0 14px">Für dich</h2>
  <div class="homegrid">${HOME.map(([t,c,dur,ch])=>`<article class="vc"><div class="scene ${c}"><span class="dur num">${dur}</span></div><div class="tt">${t}</div><div class="xs mut">${ch}</div></article>`).join('')}</div>
 </main>${d.overlay?`<div class="overlay"><div class="box"><div class="bubble" style="width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:color-mix(in oklch,var(--primary) 18%,transparent);color:var(--primary)">${ic('upload','lg')}</div><h2>Loslassen zum Hochladen</h2><p class="mut" style="margin:0">3 Videos · jedes wird ein eigener Entwurf</p></div></div>`:''}
 ${d.shown&&!d.min?dock(total):''}`}

function dock(total){const d=S.dock;const need=S.account!=='list'&&!d.storage;
 return `<section class="dock ${anim('dock')}" aria-label="Uploads"><header>${ic('upload')}<span class="t">Uploads</span><span class="xs mut num">${d.items.filter(i=>i.status==='live').length} von 3 online · <span data-dtotal>${total}</span> %</span><span style="flex:1"></span><button class="iconbtn" id="dockMin" aria-label="Minimieren">${ic('min')}</button></header>
 ${need?`<div class="dask"><b class="sm">Wo sollen deine Videos gespeichert werden?</b><div class="xs mut">Die Optimierung läuft schon, hochgeladen wird nach deiner Wahl.</div><div class="opts">
  <button class="opt" data-dstorage="free"><span class="r"></span><span><b class="sm">${FREE}</b><span class="xs mut">Kostenlos, ohne Garantie, für große Dateien oft zu klein</span></span></button>
  <button class="opt" data-dstorage="own"><span class="r"></span><span><b class="sm">Eigener oder bezahlter Server</b><span class="xs mut">Dauerhaft, du bestimmst den Anbieter</span></span></button></div></div>`:''}
 <div class="list">${d.items.map(ditem).join('')}</div><div class="xs mut" style="padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center">${ic('pen')}Uploads brauchen je Datei und Server eine Unterschrift. <button class="link xs">Automatisch erlauben</button></div></section>`}

function ditem(it){const live=it.status==='live',sig=it.status==='sig',ready=it.p>=100;
 const big=it.status==='big';const st=big?'<span style="color:var(--destructive)">Zu groß für den kostenlosen Server</span>':live?`<span style="color:var(--ok)">Online</span>`:sig?'Wartet auf deine Unterschrift':ready?'Fertig, noch nicht veröffentlicht':(S.account!=='list'&&!S.dock.storage&&it.p>=45)?'Wartet auf Speicherort':it.p<45?`Optimiert · <span data-ip="${it.id}">${it.p}</span> %`:`Lädt hoch · <span data-ip="${it.id}">${it.p}</span> %`;
 return `<div class="ditem"><div class="row"><div class="scene ${it.scene}"></div><div style="min-width:0"><input class="tit" value="${esc(it.title)}" data-tit="${it.id}" aria-label="Titel"><div class="xs mut num">${it.short?'<span class="chip p" style="margin-right:4px">Short</span>':''}${st}</div>${!live&&!ready?`<div class="bar"><i data-ibar="${it.id}" style="width:${it.p}%"></i></div>`:''}</div>
 <button class="iconbtn" data-iopen="${it.id}" aria-expanded="${it.open}" aria-label="Details">${ic('chev')}</button></div>
 ${it.open?`<div class="more"><textarea class="field" placeholder="Beschreibung (optional)" style="min-height:64px"></textarea><div class="frames" style="grid-template-columns:repeat(3,1fr)">${['dusk','noon','dawn'].map((c,i)=>`<button class="frame" aria-pressed="${i===0}"><div class="scene ${c}"></div></button>`).join('')}</div><button class="link sm" style="justify-self:start" data-studio>Alle Details in der Studio-Seite öffnen</button></div>`:''}
 ${big?`<div class="sig">${ic('info')}<span style="flex:1">Der Server hat die Datei abgelehnt. Kleiner optimieren oder einen anderen Server nehmen?</span></div><div class="acts"><button class="btn outline sm" data-small="${it.id}">Als 720p optimieren</button><button class="btn ghost sm">Anderen Server wählen</button></div>`:''}
 ${sig?`<div class="sig">${ic('pen')}<span style="flex:1">Dein Signer möchte die Veröffentlichung bestätigen.</span><button class="btn primary sm" data-sign="${it.id}">Bestätigen</button></div>`:''}
 ${big?'':live?`<div class="acts"><span class="xs mut">Auf 3 Servern, 3 Relays</span><button class="btn outline sm">${ic('out')}Ansehen</button></div>`:!sig?`<div class="acts"><label class="xs" style="display:flex;gap:8px;align-items:center"><input type="checkbox" data-iarm="${it.id}" ${it.armed?'checked':''}> Veröffentlichen, sobald fertig</label>${ready&&!it.armed?`<button class="btn primary sm" data-ipub="${it.id}">Veröffentlichen</button>`:''}</div>`:''}
 </div>`}

/* ───────── Render & Events ───────── */
function render(){
 const a=document.activeElement,id=a&&a.id,ss=a&&a.selectionStart;
 $('#app').innerHTML=S.concept==='A'?viewA():viewB();
 if(id&&document.getElementById(id)){const n=document.getElementById(id);n.focus();try{n.setSelectionRange(ss,ss)}catch(e){}}
 paint();
}
function paint(){const p=S.p;
 document.querySelectorAll('[data-bar]').forEach(b=>b.style.width=p[b.dataset.bar]+'%');
 document.querySelectorAll('[data-pct]').forEach(e=>{const v=p[e.dataset.pct];e.textContent=v>0&&v<100?Math.floor(v)+' %':''});
 const t=Math.floor((p.a*.05+p.e*.55+p.u*.3+p.m*.1));document.querySelectorAll('[data-total]').forEach(e=>e.textContent=t);
 const d=S.dock,tot=Math.round(d.items.reduce((s,i)=>s+i.p,0)/d.items.length);
 document.querySelectorAll('[data-dtotal]').forEach(e=>e.textContent=tot);
 d.items.forEach(it=>{document.querySelectorAll(`[data-ibar="${it.id}"]`).forEach(b=>b.style.width=it.p+'%');document.querySelectorAll(`[data-ip="${it.id}"]`).forEach(e=>e.textContent=Math.floor(it.p))});
}

document.addEventListener('click',e=>{if(e.target.matches('[data-modal-bg]')){S.modal=null;SEEN.delete('modal');SEEN.delete('pv');return render()}const t=e.target.closest('button,[role=button],input[type=checkbox]');if(!t)return;const ds=t.dataset;
 if(t.id==='drop'){S.phase='work';return render()}
 if(t.id==='pro'){S.pro=!S.pro;return render()}
 if(t.id==='encT'){S.settings=!(S.settings||S.pro);if(S.pro&&!S.settings)S.pro=false;return render()}
 if(ds.storage){S.storage=ds.storage;S.modal=null;SEEN.delete('modal');S.storageHint=false;return render()}
 if(ds.modal){S.modal=ds.modal==='close'?null:ds.modal;if(!S.modal)SEEN.delete('modal');return render()}
 if(ds.frame){S.frame=+ds.frame;return render()}
 if(ds.ttab){S.thumbTab=ds.ttab;return render()}
 if(ds.step){S.t=Math.max(0,Math.min(372,S.t+ +ds.step/25));if(S.frame===3)S.frame=-1;return render()}
 if(t.id==='useFrame'){S.frame=3;return render()}
 if(ds.skip){S.skip=ds.skip==='1';S.p.e=Math.min(S.p.e,5);return render()}
 if(ds.hevc){S.hevc=ds.hevc==='1';S.p.e=Math.min(S.p.e,5);return render()}
 if(ds.date){S.schedule=ds.date==='custom';return render()}
 if(t.id==='cw'){S.cw=t.checked;return render()}
 if(t.id==='addSub'){S.subs=true;return render()}
 if(ds.secOpen){S.open[ds.secOpen]=true;render();document.querySelector('[data-sec='+ds.secOpen+']').scrollIntoView({behavior:'smooth',block:'center'});return}
 if(t.id==='delDraft'){if(confirm('Entwurf löschen? Im echten Dialog: „Nur Entwurf“ oder „Entwurf und hochgeladene Dateien von den Servern löschen“.')){Object.assign(S,init());render()}return}
 if(ds.res){S.res[ds.res]=!S.res[ds.res];S.p.e=Math.min(S.p.e,5);return render()}
 if(ds.fmt){S.fmt=ds.fmt;S.p.e=Math.min(S.p.e,5);return render()}
 if(ds.q){S.quality=ds.q;return render()}
 if(t.id==='keep'){S.keep=!S.keep;return render()}
 if(ds.sec){S.open[ds.sec]=!S.open[ds.sec];return render()}
 if(t.id==='sch'){S.schedule=t.checked;return render()}
 if(t.id==='go'){if(!hasStorage()){S.storageHint=true;render();$('#askcard')?.scrollIntoView({behavior:'smooth',block:'center'});return}S.go=true;return render()}
 if(t.id==='prev'){S.modal='preview';return render()}
 if(ds.pv){S.modal=null;SEEN.delete('pv');return render()}
 if(t.id==='pubNow'){S.modal=null;SEEN.delete('pv');return publishNow()}

 if(t.id==='save'){t.textContent='Entwurf gespeichert';return}
 if(t.id==='again'){Object.assign(S,init());return render()}
 // B
 if(t.id==='fakeDrop'){if(S.dock.shown){S.dock.min=false;return render()}S.dock.overlay=true;render();setTimeout(()=>{S.dock.overlay=false;S.dock.shown=true;render()},1100);return}
 if(t.id==='dockMin'){S.dock.min=true;return render()}
 if(t.id==='dockOpen'){S.dock.min=false;return render()}
 if(ds.dstorage){S.dock.storage=ds.dstorage;return render()}
 if(ds.iopen){const it=S.dock.items.find(i=>i.id==ds.iopen);it.open=!it.open;return render()}
 if(ds.iarm){const it=S.dock.items.find(i=>i.id==ds.iarm);it.armed=t.checked;checkDock();return render()}
 if(ds.ipub){const it=S.dock.items.find(i=>i.id==ds.ipub);it.armed=true;checkDock();return render()}
 if(ds.small){const it=S.dock.items.find(i=>i.id==ds.small);it.status='run';it.small=true;it.p=50;return render()}
 if(ds.sign){S.dock.items.find(i=>i.id==ds.sign).status='live';return render()}
 if('studio' in ds){S.concept='A';Object.assign(S,init(),{phase:'work'});demoBar();return render()}
});
document.addEventListener('keydown',e=>{if(e.target.id==='drop'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();S.phase='work';render()}});
document.addEventListener('change',e=>{if(e.target.id==='exp'){S.exp=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='scrub'){S.t=+e.target.value;if(S.frame===3)S.frame=-1;$('#scrubScene').setAttribute('style',sceneStyle(S.t));$('#scrubTc').textContent=tc(S.t)+' / 6:12';const u=$('#useFrame');if(u)u.textContent='Diesen Frame verwenden';return}if(e.target.id==='title'){S.title=e.target.value;document.querySelectorAll('.preview .tt').forEach(n=>n.textContent=S.title||'Ohne Titel')}if(e.target.id==='desc')S.desc=e.target.value;
 if(e.target.dataset.tit)S.dock.items.find(i=>i.id==e.target.dataset.tit).title=e.target.value});

function publishNow(){S.signing='event';render();setTimeout(()=>{S.signing=null;S.published=true;render()},1500)}
function checkDock(){S.dock.items.forEach(it=>{if(it.p>=100&&it.armed&&it.status==='run')it.status=it.needsSig?'sig':'live'})}

setInterval(()=>{const k=S.fast?6:1;let changed=false;
 if(S.concept==='A'&&S.phase==='work'&&!S.published&&!S.signing){const p=S.p;
  const bump=(key,v)=>{const was=p[key];p[key]=Math.min(100,p[key]+v*k);if(was<100&&p[key]>=100)changed=true;if(was===0&&p[key]>0)changed=true};
  if(p.a<100)bump('a',9);else if(S.skip){if(p.e<100){p.e=100;changed=true}}else if(p.e<100)bump('e',.55);
  if(p.e>=100&&S.go&&p.u<100)bump('u',1.1);if(p.u>=100&&p.m<100)bump('m',2.2);
  if(changed)render();else paint()}
 if(S.concept==='B'&&S.dock.shown){const blocked=S.account!=='list'&&!S.dock.storage;
  S.dock.items.forEach((it,i)=>{if(it.status!=='run'||it.p>=100)return;const was=it.p;const sp=[.9,1.6,.5][i]*k;
   if(blocked&&it.p>=45)return;if(S.dock.storage==='free'&&it.id===3&&!it.small&&it.p>=60){it.status='big';changed=true;return}it.p=Math.min(100,it.p+sp);if((was<45&&it.p>=45)||it.p>=100)changed=true});
  if(changed){checkDock();render()}else paint()}
},120);

demoBar();render();
</script>
</body>
