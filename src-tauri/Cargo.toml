[package]
name = "nostube-desktop"
version = "0.1.0"
description = "NosTube macOS desktop host"
authors = ["NosTube contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
reqwest = { version = "0.13.2", default-features = false, features = ["rustls"] }
tauri = { version = "2.11.0", features = [] }
tauri-plugin-shell = "2.3.5"
nostr = { version = "0.43.0", features = ["nip04", "nip44", "nip49"] }
security-framework = "3.7.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
zeroize = "1.8.2"
